name: sc-companion-candidate
services:
  companion:
    image: sc-companion:hosting-candidate
    build:
      context: ..
      dockerfile: SC_Companion/Dockerfile
      args:
        SOURCE_FINGERPRINT: ${SC_COMPANION_SOURCE_FINGERPRINT:-unknown}
    env_file:
      - path: .env
        required: false
    volumes:
      - candidate_data:/data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "sc-companion-status", "--check"]
      interval: 30s
      timeout: 5s
      start_period: 90s
volumes:
  candidate_data:
